[project]
name = "plaguekind-nodes"
description = "Custom ComfyUI nodes providing unified image & mask resizing, crop/bbox tools, media loading, LTX & MiniMax-H3 LoRA/refmod loading, the MiniMax H3 video pipeline (combined node, SLA attention, AdaLN LoRA fix, block cache, tiled video upsampler), and workflow bundle I/O."
version = "1.6.8"
license = "MIT" 
